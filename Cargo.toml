[package]
name = "homelab-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
chrono = "0.4.45"
getrandom = "0.4.3"
mcp = { git = "https://git.holdenitdown.net/rfhold/kuri.git", rev = "003a11f1405818f39eba01612b0d00ee552e3be0", default-features = false, features = ["oauth-authorization-server-postgres", "oauth-resource-owner-oidc-postgres", "progressive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.7"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
