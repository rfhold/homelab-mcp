[package]
name = "homelab-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
getrandom = "0.4.3"
http = "1.4.0"
mcp = { git = "https://git.holdenitdown.net/rfhold/kuri.git", rev = "184ce47ba45537ccb310de48a9b918d9423f3460", default-features = false, features = ["oauth-authorization-server-postgres", "oauth-resource-owner-oidc-postgres", "progressive"] }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
percent-encoding = "2.3.2"
pyroscope = { version = "=2.0.6", features = ["backend-pprof-rs"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
reqwest-middleware = { version = "0.5.1", features = ["json"] }
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs"] }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.7"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
