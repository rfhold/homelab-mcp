config:
  kubernetes:context: pantheon
  homelab-mcp:namespace: homelab-mcp
  homelab-mcp:hostname: homelab-mcp.holdenitdown.net
  homelab-mcp:displayName: Homelab MCP
  homelab-mcp:slug: homelab-mcp
  homelab-mcp:authentikBaseUrl: https://auth.holdenitdown.net
  homelab-mcp:protectData: "true"
  homelab-mcp:storageClass: shared-fs
  homelab-mcp:databaseStorageSize: 20Gi
  homelab-mcp:backupStorageClass: default-bucket
  homelab-mcp:backupEndpoint: https://s3.pantheon.holdenitdown.net
  homelab-mcp:backupRetention: 30d
  homelab-mcp:backupSchedule: 0 0 2 * * *
  homelab-mcp:kubernetesClusters:
    - name: pantheon
      context: pantheon
      server: https://pantheon.holdenitdown.net:6443
      apiServerEndpointCidrs: [172.16.3.0/24]
    - name: romulus
      context: romulus
      server: https://romulus.holdenitdown.net:6443
      apiServerEndpointCidrs: [172.16.4.0/24]
  homelab-mcp:cephClusters: []
  homelab-mcp:mcpOAuthAccessTokenTtl: "259200"
  homelab-mcp:mcpOAuthRefreshTokenTtl: "86400"
  homelab-mcp:mcpOAuthRefreshFamilyTtl: "2592000"
  homelab-mcp:mcpOAuthCodeTtl: "300"
  homelab-mcp:mcpOAuthWrappingKeyVersions: [v1]
  homelab-mcp:mcpOAuthActiveWrappingKeyVersion: v1
  homelab-mcp:openbaoEnabled: false
  homelab-mcp:openbaoUrl: https://openbao.holdenitdown.net
  homelab-mcp:openbaoCreateSshMount: false
  homelab-mcp:openbaoKubernetesAuthMount: kubernetes
  homelab-mcp:openbaoKubernetesRole: homelab-mcp
  homelab-mcp:openbaoSshMount: homelab-ssh-client
  homelab-mcp:openbaoSshRole: homelab
  homelab-mcp:openbaoAudience: https://openbao.holdenitdown.net
  homelab-mcp:openbaoEndpointCidrs: [172.16.3.0/24]
  homelab-mcp:openbaoPort: 443
  homelab-mcp:deployMachineSshEgressCidrs: []
